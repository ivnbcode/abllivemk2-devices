<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>☉ 420 ☽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Estética Esotérica Cósmica 420: Obsidiana Sideral + Oro Alquímico + Violeta Nebular + Carmesí */
      --panel-black: #07060c;
      --panel-matte: #0d0b14;
      --panel-module: #12101c;
      --panel-inset: #090810;
      --silk-gold: #dfba69;
      --silk-gold-bright: #f9dc94;
      --silk-gold-dim: rgba(223, 186, 105, 0.35);
      --silk-cream: #f0eadc;
      --silk-muted: #9e9589;
      --polivoks-red: #d9383a;
      --cosmic-violet: #9d4edd;
      --led-red: #ff3b30;
      --led-amber: #ffbe0b;
      --led-green: #28cd41;
      --led-cyan: #72efdd;
      --copper-trace: #cc9742;
      --font-tech: 'JetBrains Mono', monospace;
      --font-title: 'Cinzel', 'Orbitron', serif;
      --font-ui: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #040308;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(157, 78, 221, 0.14) 0%, rgba(223, 186, 105, 0.06) 40%, transparent 75%),
        radial-gradient(circle at 15% 80%, rgba(223, 186, 105, 0.07) 0%, transparent 45%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.008) 0px, rgba(255,255,255,0.008) 1px, transparent 1px, transparent 5px);
      color: var(--silk-cream);
      font-family: var(--font-tech);
      padding: 10px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Marco Exterior del Chasis Esotérico 420 */
    .solar-workstation {
      max-width: 1620px;
      margin: 0 auto;
      background:
        radial-gradient(circle at 50% 50%, rgba(223, 186, 105, 0.035) 0%, transparent 70%),
        var(--panel-matte);
      border: 2px solid var(--silk-gold);
      border-radius: 8px;
      padding: 10px;
      box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.95),
        0 0 35px rgba(223, 186, 105, 0.12),
        inset 0 0 0 1px rgba(223, 186, 105, 0.25);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    /* Tornillos Hexava en Esquinas */
    .screw {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #555, #1b1d22);
      border: 1px solid #3a3d45;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
      display: inline-block;
    }

    /* CABECERA SUPERIOR: IDENTIDAD SOLAR 42N + ESTADO ARTURIA MINILAB MKII */
    .top-silkscreen-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: linear-gradient(180deg, #171a21 0%, #0e1015 100%);
      border: 1px solid var(--silk-gold);
      border-radius: 5px;
    }

    .solar-logo-block {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .solar-sun-emblem {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--silk-gold-bright);
      background: radial-gradient(circle, var(--silk-gold-bright) 18%, #70531c 65%, #111 100%);
      box-shadow: 0 0 15px rgba(242, 204, 118, 0.45);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #0a0b0d;
      font-size: 0.78rem;
    }

    .title-group h1 {
      font-family: var(--font-title);
      font-size: 1.18rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: var(--silk-gold-bright);
      text-transform: uppercase;
    }

    .title-group p {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--silk-muted);
    }

    .top-actions-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .solar-btn {
      font-family: var(--font-tech);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 6px 11px;
      background: #171a20;
      color: var(--silk-cream);
      border: 1px solid var(--silk-gold-dim);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    .solar-btn:hover {
      border-color: var(--silk-gold-bright);
      color: var(--silk-gold-bright);
      background: #20242d;
    }

    .solar-btn.active {
      background: var(--silk-gold);
      color: #090a0c;
      border-color: var(--silk-gold-bright);
      box-shadow: 0 0 12px rgba(216, 177, 90, 0.5);
    }

    .solar-btn.power-switch {
      border-color: var(--polivoks-red);
      background: rgba(217, 56, 41, 0.18);
      color: #ff9c93;
    }

    .solar-btn.power-switch.active {
      background: var(--polivoks-red);
      color: #fff;
      box-shadow: 0 0 18px rgba(255, 59, 48, 0.75);
    }

    .solar-btn.learn-active {
      background: var(--led-cyan);
      color: #05080a;
      border-color: #fff;
      animation: blinkLearn 0.8s infinite;
    }

    @keyframes blinkLearn {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .solar-select {
      font-family: var(--font-tech);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 6px 9px;
      background: #0d0f13;
      color: var(--silk-gold-bright);
      border: 1px solid var(--silk-gold-dim);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .solar-select:focus {
      border-color: var(--silk-gold-bright);
    }

    /* LED Hardware */
    .hw-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2b2d33;
      border: 1px solid #000;
      display: inline-block;
      transition: all 0.1s;
    }

    .hw-led.red.on { background: var(--led-red); box-shadow: 0 0 8px var(--led-red); }
    .hw-led.amber.on { background: var(--led-amber); box-shadow: 0 0 8px var(--led-amber); }
    .hw-led.green.on { background: var(--led-green); box-shadow: 0 0 8px var(--led-green); }
    .hw-led.cyan.on { background: var(--led-cyan); box-shadow: 0 0 8px var(--led-cyan); }

    /* FILA 1: ARQUITECTURA DE VOCES SOLAR 42N + FORMAS DE ONDA + FOTOCELDA LDR */
    .solar-panel-row {
      display: grid;
      grid-template-columns: 1.05fr 1.65fr 1.1fr;
      gap: 10px;
    }

    @media (max-width: 1320px) {
      .solar-panel-row {
        grid-template-columns: 1fr;
      }
    }

    .hw-module {
      background: var(--panel-module);
      border: 1px solid var(--silk-gold);
      border-radius: 5px;
      padding: 10px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.65);
    }

    .hw-module.polivoks-module {
      border-color: #c84b31;
    }

    .module-silk-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--silk-gold-dim);
      padding-bottom: 5px;
      margin-bottom: 2px;
    }

    .module-silk-title {
      font-family: var(--font-title);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--silk-gold-bright);
      display: flex;
      align-items: center;
      gap: 7px;
      text-transform: uppercase;
    }

    .silk-badge {
      font-size: 0.58rem;
      padding: 2px 6px;
      border: 1px solid var(--silk-gold-dim);
      color: var(--silk-cream);
      border-radius: 3px;
      background: rgba(216, 177, 90, 0.08);
    }

    /* Selectores de Forma de Onda con Iconos SVG */
    .wave-selector-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 6px;
    }

    .wave-box {
      background: var(--panel-inset);
      border: 1px solid rgba(216, 177, 90, 0.25);
      border-radius: 4px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .wave-box-label {
      font-size: 0.58rem;
      color: var(--silk-gold);
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wave-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .wave-pill {
      flex: 1;
      min-width: 34px;
      font-family: var(--font-tech);
      font-size: 0.58rem;
      font-weight: 700;
      padding: 4px 3px;
      background: #161920;
      color: var(--silk-muted);
      border: 1px solid #2c303a;
      border-radius: 3px;
      cursor: pointer;
      text-align: center;
      transition: all 0.1s;
    }

    .wave-pill:hover {
      color: var(--silk-cream);
      border-color: var(--silk-gold-dim);
    }

    .wave-pill.active {
      background: rgba(216, 177, 90, 0.22);
      color: var(--silk-gold-bright);
      border-color: var(--silk-gold-bright);
      box-shadow: 0 0 6px rgba(216, 177, 90, 0.35);
    }

    /* Enjambre de 6 Voces Drone Solar 42N */
    .solar-6-drones-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    @media (max-width: 720px) {
      .solar-6-drones-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .drone-channel {
      background: var(--panel-inset);
      border: 1px solid rgba(216, 177, 90, 0.28);
      border-radius: 4px;
      padding: 6px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: all 0.12s;
    }

    .drone-channel.muted {
      opacity: 0.42;
      border-color: #262932;
    }

    .drone-ch-header {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--silk-gold-bright);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .drone-toggle-btn {
      width: 100%;
      font-family: var(--font-tech);
      font-size: 0.56rem;
      font-weight: 700;
      padding: 3px 2px;
      border-radius: 3px;
      border: 1px solid var(--silk-gold);
      background: rgba(216, 177, 90, 0.2);
      color: var(--silk-gold-bright);
      cursor: pointer;
    }

    .drone-channel.muted .drone-toggle-btn {
      background: #14171d;
      border-color: #353942;
      color: var(--silk-muted);
    }

    /* MATRIZ DE 16 PERILLAS ROTATORIAS ARTURIA MINILAB MKII (2 FILAS x 8 ENCODERS) */
    .minilab-knobs-deck {
      background: linear-gradient(180deg, #14171e 0%, #0d0f14 100%);
      border: 1px solid var(--silk-gold);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .knobs-row-8 {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
    }

    @media (max-width: 1180px) {
      .knobs-row-8 {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 600px) {
      .knobs-row-8 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .rotary-cell {
      background: #11141a;
      border: 1px solid rgba(216, 177, 90, 0.25);
      border-radius: 5px;
      padding: 6px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      position: relative;
      cursor: ns-resize;
      transition: border-color 0.12s, box-shadow 0.12s;
    }

    .rotary-cell:hover {
      border-color: var(--silk-gold-bright);
    }

    .rotary-cell.midi-active {
      border-color: var(--led-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
    }

    .rotary-cell.learning-target {
      border-color: var(--led-amber);
      box-shadow: 0 0 14px rgba(255, 170, 0, 0.6);
    }

    .knob-top-badges {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.54rem;
      color: var(--silk-muted);
    }

    .knob-k-num {
      color: var(--silk-gold-bright);
      font-weight: 700;
    }

    .knob-cc-tag {
      background: rgba(255,255,255,0.05);
      padding: 0 4px;
      border-radius: 2px;
      color: #a3e635;
    }

    /* Perilla Física Estilo Davies 1900H / Solar 42N */
    .solar-knob-dial {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #2e323b, #121419 75%);
      border: 2px solid #3f4450;
      box-shadow:
        0 4px 8px rgba(0, 0, 0, 0.75),
        inset 0 1px 1px rgba(255, 255, 255, 0.12);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }

    .solar-knob-dial::after {
      content: "";
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px dashed rgba(216, 177, 90, 0.35);
      position: absolute;
    }

    .knob-pointer {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-135deg);
      pointer-events: none;
    }

    .knob-pointer::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 13px;
      border-radius: 2px;
      background: var(--silk-cream);
      box-shadow: 0 0 5px var(--silk-gold-bright);
    }

    .rotary-cell.polivoks-knob .knob-pointer::before {
      background: #ff6b5b;
      box-shadow: 0 0 6px var(--polivoks-red);
    }

    .knob-title {
      font-size: 0.58rem;
      font-weight: 700;
      color: var(--silk-cream);
      text-align: center;
      letter-spacing: 0.03em;
      line-height: 1.15;
    }

    .knob-readout {
      font-size: 0.6rem;
      color: var(--silk-gold-bright);
      font-weight: 700;
    }

    /* Pantallas de Visualización (Joystick Vectorial + Osciloscopio + Fotocelda LDR) */
    .displays-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .crt-screen {
      background: #06080b;
      border: 1.5px solid var(--silk-gold);
      border-radius: 4px;
      height: 165px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
    }

    .crt-screen canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .crt-label {
      position: absolute;
      top: 5px;
      left: 7px;
      font-size: 0.56rem;
      color: var(--silk-gold-bright);
      background: rgba(6, 8, 11, 0.8);
      padding: 2px 5px;
      border: 1px solid rgba(216, 177, 90, 0.3);
      border-radius: 3px;
      pointer-events: none;
    }

    /* Tiras Táctiles del Arturia MiniLab MkII + Fotocelda LDR */
    .strips-and-ldr-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 6px;
      margin-top: 2px;
    }

    .strip-indicator-box {
      background: var(--panel-inset);
      border: 1px solid rgba(216, 177, 90, 0.28);
      border-radius: 4px;
      padding: 5px 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .strip-bar-track {
      width: 100%;
      height: 8px;
      background: #1a1d24;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      cursor: ew-resize;
    }

    .strip-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--silk-gold), var(--led-cyan));
      width: 50%;
    }

    /* 8 Pads RGB del Arturia MiniLab MkII */
    .minilab-pads-row {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }

    @media (max-width: 780px) {
      .minilab-pads-row {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .minilab-pad {
      background: #13161d;
      border: 2px solid #2e3442;
      border-radius: 5px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.1s;
    }

    .minilab-pad:hover {
      border-color: var(--silk-gold);
    }

    .minilab-pad.pad-active {
      background: rgba(216, 177, 90, 0.22);
      border-color: var(--silk-gold-bright);
      box-shadow: 0 0 12px rgba(216, 177, 90, 0.45);
    }

    .pad-num {
      font-size: 0.55rem;
      color: var(--silk-muted);
    }

    .pad-action {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--silk-gold-bright);
      text-align: center;
    }

    /* SECCIÓN INFERIOR: 12 PLACAS CAPACITIVAS DE COBRE SOLAR 42N + SECUENCIADOR POR PASOS */
    .bottom-performance-row {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 10px;
    }

    @media (max-width: 1180px) {
      .bottom-performance-row {
        grid-template-columns: 1fr;
      }
    }

    .solar-copper-plates {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 5px;
    }

    @media (max-width: 680px) {
      .solar-copper-plates {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    .copper-plate-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: #0e1014;
      border: 1px solid rgba(216, 177, 90, 0.35);
      border-radius: 5px;
      padding: 5px 3px;
    }

    .plate-hold-toggle {
      font-size: 0.52rem;
      padding: 2px 5px;
      background: #171a22;
      color: var(--silk-muted);
      border: 1px solid #2f3440;
      border-radius: 3px;
      cursor: pointer;
      width: 90%;
      text-align: center;
    }

    .plate-hold-toggle.held {
      background: var(--polivoks-red);
      color: #fff;
      border-color: #ff7b6e;
      box-shadow: 0 0 8px var(--polivoks-red);
    }

    /* Placa Táctil de Cobre Dorado Grabado en PCB (Idéntica al Solar 42N) */
    .pcb-touch-pad {
      width: 100%;
      height: 112px;
      background-color: #0b0d10;
      background-image:
        repeating-linear-gradient(
          0deg,
          var(--copper-trace) 0px,
          var(--copper-trace) 2px,
          #0b0d10 2px,
          #0b0d10 6px
        );
      border: 1.5px solid var(--silk-gold);
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 5px 2px;
      touch-action: none;
      overflow: hidden;
      transition: all 0.08s;
    }

    /* Línea central vertical de interdigitación PCB */
    .pcb-touch-pad::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: var(--silk-gold-bright);
      opacity: 0.55;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .pcb-touch-pad.touched {
      border-color: #fff;
      box-shadow: 0 0 18px var(--silk-gold-bright), inset 0 0 15px rgba(242, 204, 118, 0.55);
      transform: scale(0.985);
    }

    .plate-label-badge {
      background: rgba(10, 11, 13, 0.88);
      border: 1px solid var(--silk-gold);
      color: var(--silk-gold-bright);
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 2px;
      z-index: 2;
    }

    .plate-pressure-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0%;
      background: linear-gradient(0deg, rgba(242, 204, 118, 0.55), rgba(0, 229, 255, 0.35));
      pointer-events: none;
      z-index: 1;
    }

    /* Secuenciador Analógico CV/Gate de 8 Pasos */
    .seq-8-columns {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      height: 100%;
    }

    .seq-col {
      background: #0d0f13;
      border: 1px solid rgba(216, 177, 90, 0.25);
      border-radius: 4px;
      padding: 6px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .seq-col.active-step {
      border-color: var(--led-red);
