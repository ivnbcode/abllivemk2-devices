    let lfoGainL = null;
    let lfoGainR = null;

    let chorusDelayL = null;
    let chorusDelayR = null;

    let tapeDelayL = null;
    let tapeDelayR = null;
    let tapeFeedback = null;
    let tapeFilter = null;
    let tapeMixGain = null;

    let reverbConvolver = null;
    let reverbMixGain = null;
    let shimmerHarmOsc1 = null;
    let shimmerHarmOsc2 = null;
    let shimmerFilter = null;
    let shimmerSendGain = null;

    // 1. Generar Tablas de Onda Espectrales Ricas (Blendwave + Solar Harmonics)
    function createCustomWavetables(audioCtx) {
      const N = 48;
      const tables = {};

      // Glass Harmonics (Campanas de cristal cálidas sin aliasing agudo)
      let real = new Float32Array(N), imag = new Float32Array(N);
      for (let k = 1; k < N; k++) {
        imag[k] = (k % 2 === 1 ? 1.0 / k : 0.45 / k) * Math.exp(-k * 0.075);
      }
      tables.glass = audioCtx.createPeriodicWave(real, imag);

      // Spectral Choir (Formantes vocales A-O-U suaves)
      real = new Float32Array(N); imag = new Float32Array(N);
      for (let k = 1; k < N; k++) {
        const f1 = Math.exp(-Math.pow((k - 3) / 1.8, 2));
        const f2 = 0.65 * Math.exp(-Math.pow((k - 7) / 2.2, 2));
        const f3 = 0.3 * Math.exp(-Math.pow((k - 13) / 2.5, 2));
        imag[k] = (0.35 / k) + 0.55 * (f1 + f2 + f3);
      }
      tables.choir = audioCtx.createPeriodicWave(real, imag);

      // Cathedral Pipe Organ (Drawbars armónicos puros)
      real = new Float32Array(N); imag = new Float32Array(N);
      [1, 2, 3, 4, 6, 8, 12, 16].forEach((h, i) => {
        if (h < N) imag[h] = Math.pow(0.78, i);
      });
      tables.organ = audioCtx.createPeriodicWave(real, imag);

      // Astral Fifths (Armónicos espaciales Ambient Ø)
      real = new Float32Array(N); imag = new Float32Array(N);
      for (let k = 1; k < N; k++) {
        imag[k] = [1, 2, 3, 6, 9, 12, 18].includes(k) ? 1 / Math.pow(k, 0.65) : 0.05 / k;
      }
      tables.astral = audioCtx.createPeriodicWave(real, imag);

      // Warm Strings / SuperSaw suave
      real = new Float32Array(N); imag = new Float32Array(N);
      for (let k = 1; k < N; k++) {
        imag[k] = (1 / k) * Math.exp(-k * 0.035);
        real[k] = (0.25 / k) * Math.sin(k * 0.7);
      }
      tables.strings = audioCtx.createPeriodicWave(real, imag);
      tables.supersaw = tables.strings;

      return tables;
    }

    function applyWaveformToOsc(osc, waveName) {
      if (!osc || !ctx) return;
      if (['sine', 'triangle', 'sawtooth', 'square'].includes(waveName)) {
        osc.type = waveName;
      } else if (periodicWaves[waveName]) {
        osc.setPeriodicWave(periodicWaves[waveName]);
      }
    }

    // Curva de Saturación Analógica Polivoks (Cálida y musical, sin distorsión áspera)
    function createWarmPolivoksCurve(driveAmount) {
      const k = 1 + driveAmount * 14;
      const n = 2048;
      const curve = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const x = (i * 2) / n - 1;
        // Saturación asimétrica de válvula/diodo soviético con compresión suave
        curve[i] = Math.tanh(x * k + 0.06 * x * x) / Math.tanh(k + 0.06);
      }
      return curve;
    }

    // Impulso Estéreo Terciopelo de Catedral (Sin resonancias metálicas)
    function buildVelvetCathedralIR(audioCtx, duration = 5.4, decay = 3.1) {
      const sr = audioCtx.sampleRate;
      const len = Math.floor(sr * duration);
      const buffer = audioCtx.createBuffer(2, len, sr);
      for (let ch = 0; ch < 2; ch++) {
        const data = buffer.getChannelData(ch);
        let lp = 0;
        for (let i = 0; i < len; i++) {
          const t = i / sr;
          const env = Math.pow(1 - i / len, decay) * (1 - Math.exp(-t * 22));
          const raw = (Math.random() * 2 - 1);
          // Filtro paso-bajo progresivo en la cola para sonido sedoso y oscuro
          const dampCoeff = Math.max(0.08, 0.55 - (i / len) * 0.42);
          lp = lp + dampCoeff * (raw - lp);
          data[i] = lp * env * 0.85;
        }
      }
      return buffer;
    }

    // 2. Inicializar Motor de Audio Estéreo de Alta Definición
    function initAudioEngine() {
      if (ctx) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      ctx = new AudioCtx();
      periodicWaves = createCustomWavetables(ctx);

      masterGain = ctx.createGain();
      masterGain.gain.value = 0.82;

      // Realce Sub-Grave Analógico Cálido (85 Hz) + Limitador Suave
      subBassBoost = ctx.createBiquadFilter();
      subBassBoost.type = 'lowshelf';
      subBassBoost.frequency.value = 85;
      subBassBoost.gain.value = 4.5;

      const compressor = ctx.createDynamicsCompressor();
      compressor.threshold.value = -10;
      compressor.knee.value = 12;
      compressor.ratio.value = 3.5;
      compressor.attack.value = 0.015;
      compressor.release.value = 0.25;

      analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;

      // Bus Pre-Filtro Estéreo (Izquierdo y Derecho como en el Solar 42N)
      const mixBusL = ctx.createGain();
      const mixBusR = ctx.createGain();

      // Etapa 1: Filtro Pasa-Altos Estéreo (HPF L / R) con resonancia
      hpfL = ctx.createBiquadFilter();
      hpfR = ctx.createBiquadFilter();
      hpfL.type = 'highpass';
      hpfR.type = 'highpass';
      hpfL.frequency.value = params.hpfCutoff;
      hpfR.frequency.value = params.hpfCutoff;

      // Etapa 2: Filtro Pasa-Bajos Polivoks Estéreo (LPF L / R) + 2da etapa suave
      filterL = ctx.createBiquadFilter();
      filterR = ctx.createBiquadFilter();
      filterL.type = 'lowpass';
      filterR.type = 'lowpass';

      filterL2 = ctx.createBiquadFilter();
      filterR2 = ctx.createBiquadFilter();
      filterL2.type = 'lowpass';
      filterR2.type = 'lowpass';
      filterL2.frequency.value = 7200;
      filterR2.frequency.value = 7200;

      // Etapa 3: Trémolo / Pulser Estéreo (Binaural Pan o Mono Amp)
      tremGainL = ctx.createGain();
      tremGainR = ctx.createGain();
      tremGainL.gain.value = 0.85;
      tremGainR.gain.value = 0.85;

      tremOsc = ctx.createOscillator();
      applyWaveformToOsc(tremOsc, state.tremWave);
      tremOsc.frequency.value = params.tremRate;

      tremDepthL = ctx.createGain();
      tremDepthR = ctx.createGain();
      tremDepthL.gain.value = params.tremDepth * 0.45;
      // En modo Stereo Pan, el canal derecho tiene fase invertida (-180°) para paneo espacial
      tremDepthR.gain.value = -params.tremDepth * 0.45;

      tremOsc.connect(tremDepthL);
      tremOsc.connect(tremDepthR);
      tremDepthL.connect(tremGainL.gain);
      tremDepthR.connect(tremGainR.gain);
      tremOsc.start();

      polivoksShaper = ctx.createWaveShaper();
      polivoksShaper.curve = createWarmPolivoksCurve(params.drive);
      polivoksShaper.oversample = '4x';

      // LFO Principal hacia ambos filtros Polivoks
      lfoOsc = ctx.createOscillator();
      lfoOsc.frequency.value = params.lfoRate;
      lfoGainL = ctx.createGain();
      lfoGainR = ctx.createGain();
      lfoOsc.connect(lfoGainL);
      lfoOsc.connect(lfoGainR);
      lfoGainL.connect(filterL.frequency);
      lfoGainR.connect(filterR.frequency);
      lfoOsc.start();

      // Chorus BBD Estéreo Analógico (ensancha enormemente las voces Drone y Pad)
      chorusDelayL = ctx.createDelay(0.05);
      chorusDelayR = ctx.createDelay(0.05);
      chorusDelayL.delayTime.value = 0.014;
      chorusDelayR.delayTime.value = 0.019;

      const chorusLfo = ctx.createOscillator();
      chorusLfo.frequency.value = 0.38;
      const chorusDepthL = ctx.createGain();
      const chorusDepthR = ctx.createGain();
      chorusDepthL.gain.value = 0.0028;
      chorusDepthR.gain.value = -0.0028;
      chorusLfo.connect(chorusDepthL);
      chorusLfo.connect(chorusDepthR);
      chorusDepthL.connect(chorusDelayL.delayTime);
      chorusDepthR.connect(chorusDelayR.delayTime);
      chorusLfo.start();

      const stereoMerger = ctx.createChannelMerger(2);

      // Ruta serie: MixBus -> HPF (Pasa-Altos) -> LPF (Pasa-Bajos) -> Filter2 -> Trémolo -> Merger + Chorus
      mixBusL.connect(hpfL);
      mixBusR.connect(hpfR);
      hpfL.connect(filterL);
      hpfR.connect(filterR);
      filterL.connect(filterL2);
      filterR.connect(filterR2);
      filterL2.connect(tremGainL);
      filterR2.connect(tremGainR);

      tremGainL.connect(stereoMerger, 0, 0);
      tremGainR.connect(stereoMerger, 0, 1);

      // Sumar señal Chorus BBD al campo estéreo
      tremGainL.connect(chorusDelayL);
      tremGainR.connect(chorusDelayR);
      chorusDelayL.connect(stereoMerger, 0, 0);
      chorusDelayR.connect(stereoMerger, 0, 1);

      stereoMerger.connect(polivoksShaper);

      // --- CAPA 1: 6 VOCES DRONE SOLAR 42N (Cada voz tiene 2 osciladores desfasados + Drift) ---
      droneLayerGain = ctx.createGain();
      droneVoiceNodes = [];

      state.droneVoices.forEach((v, idx) => {
        const oscA = ctx.createOscillator();
        const oscB = ctx.createOscillator();
        applyWaveformToOsc(oscA, state.droneWave);
        applyWaveformToOsc(oscB, state.droneWave);

        const voiceGain = ctx.createGain();
        voiceGain.gain.value = v.muted ? 0 : 0.14;

        // Paneo distribuido en el campo estéreo como el mezclador del Solar 42N
        const panPos = ((idx / 5) * 2 - 1) * 0.75;
        const gainL = ctx.createGain();
        const gainR = ctx.createGain();
        gainL.gain.value = Math.cos((panPos + 1) * Math.PI / 4);
        gainR.gain.value = Math.sin((panPos + 1) * Math.PI / 4);

        oscA.connect(voiceGain);
        oscB.connect(voiceGain);
        voiceGain.connect(gainL);
        voiceGain.connect(gainR);

        gainL.connect(droneLayerGain);
        gainR.connect(droneLayerGain);

        oscA.start();
        oscB.start();
        droneVoiceNodes.push({ oscA, oscB, voiceGain });
      });

      // Sub-Oscilador Profundo (-1 Octava)
      droneSubOsc = ctx.createOscillator();
      applyWaveformToOsc(droneSubOsc, state.subWave);
      const subGain = ctx.createGain();
      subGain.gain.value = 0.32;
      droneSubOsc.connect(subGain);
      subGain.connect(droneLayerGain);
      droneSubOsc.start();

      droneLayerGain.connect(mixBusL);
      droneLayerGain.connect(mixBusR);

      // --- CAPA 2: SONICWARE AMBIENT Ø YIN-YANG BLENDWAVE PAD ---
      padLayerGain = ctx.createGain();
      yinGain = ctx.createGain();
      yangGain = ctx.createGain();
      yinOscs = [];
      yangOscs = [];

      // Acorde de 4 voces espaciadas (Fundamental, Quinta, Octava, Décima)
      const padIntervals = [1.0, 1.5, 2.0, 2.5];
      padIntervals.forEach((intv, i) => {
        const oYin = ctx.createOscillator();
        const oYang = ctx.createOscillator();
        applyWaveformToOsc(oYin, state.yinWave);
        applyWaveformToOsc(oYang, state.yangWave);

        const gYin = ctx.createGain();
        const gYang = ctx.createGain();
        gYin.gain.value = 0.22;
        gYang.gain.value = 0.22;

        oYin.connect(gYin);
        oYang.connect(gYang);
        gYin.connect(yinGain);
        gYang.connect(yangGain);

        oYin.start();
        oYang.start();
        yinOscs.push({ osc: oYin, intv, idx: i });
        yangOscs.push({ osc: oYang, intv, idx: i });
      });

      yinGain.connect(padLayerGain);
      yangGain.connect(padLayerGain);
      padLayerGain.connect(mixBusL);
      padLayerGain.connect(mixBusR);

      // --- CAPA 3: VOCES MELÓDICAS V/OCT + ATMOS FM (PLACAS CAPACITIVAS Y TECLADO MINILAB) ---
      atmosLayerGain = ctx.createGain();
      vcoEnvGain = ctx.createGain();
      vcoEnvGain.gain.value = 0.14;

      vcoMainOsc = ctx.createOscillator();
      vcoSubOsc = ctx.createOscillator();
      vcoModOsc = ctx.createOscillator();
      applyWaveformToOsc(vcoMainOsc, state.vcoWave);
      applyWaveformToOsc(vcoSubOsc, state.subWave);
      vcoModOsc.type = 'sine';

      const vcoSubMix = ctx.createGain();
      vcoSubMix.gain.value = 0.35;

      vcoFmGain = ctx.createGain();
      vcoFmGain.gain.value = 45;

      vcoModOsc.connect(vcoFmGain);
      vcoFmGain.connect(vcoMainOsc.frequency);

      vcoMainOsc.connect(vcoEnvGain);
      vcoSubOsc.connect(vcoSubMix);
      vcoSubMix.connect(vcoEnvGain);
      vcoEnvGain.connect(atmosLayerGain);

      vcoMainOsc.start();
      vcoSubOsc.start();
      vcoModOsc.start();

      atmosLayerGain.connect(mixBusL);
      atmosLayerGain.connect(mixBusR);

      // --- CAPA 4: RUIDO ROSA + OSCILADORES CAÓTICOS SCHMITT-TRIGGER ---
      noiseLayerGain = ctx.createGain();
      const noiseLen = ctx.sampleRate * 4;
      const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
      const chData = noiseBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < noiseLen; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.0168980;
        chData[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.04;
        b6 = w * 0.115926;
      }

      noiseSource = ctx.createBufferSource();
      noiseSource.buffer = noiseBuf;
      noiseSource.loop = true;

      noiseBandFilter = ctx.createBiquadFilter();
      noiseBandFilter.type = 'bandpass';
      noiseBandFilter.frequency.value = 520;
      noiseBandFilter.Q.value = 4.0;

      schmittOscA = ctx.createOscillator();
      schmittOscB = ctx.createOscillator();
      schmittOscA.type = 'triangle';
      schmittOscB.type = 'sawtooth';
      const schmittCross = ctx.createGain();
      schmittCross.gain.value = 140;
      const schmittMix = ctx.createGain();
      schmittMix.gain.value = 0.06;

      schmittOscB.connect(schmittCross);
      schmittCross.connect(schmittOscA.frequency);
      schmittOscA.connect(schmittMix);
      schmittMix.connect(noiseBandFilter);

      noiseSource.connect(noiseBandFilter);
      noiseBandFilter.connect(noiseLayerGain);

      noiseSource.start();
      schmittOscA.start();
      schmittOscB.start();

      noiseLayerGain.connect(mixBusL);
      noiseLayerGain.connect(mixBusR);

      // --- CARTUCHO DUAL DE EFECTOS: TAPE DELAY CON FILTRO DE CINTA + CATHEDRAL SHIMMER ---
      tapeDelayL = ctx.createDelay(2.0);
      tapeDelayR = ctx.createDelay(2.0);
      tapeDelayL.delayTime.value = 0.42;
      tapeDelayR.delayTime.value = 0.56;

      tapeFilter = ctx.createBiquadFilter();
      tapeFilter.type = 'lowpass';
      tapeFilter.frequency.value = 2400; // Oscurece las repeticiones como cinta real

      tapeFeedback = ctx.createGain();
      tapeFeedback.gain.value = 0.52;
      tapeMixGain = ctx.createGain();

      // Modulación Wow & Flutter
      const wowOsc = ctx.createOscillator();
      wowOsc.frequency.value = 0.45;
      const wowDepth = ctx.createGain();
      wowDepth.gain.value = 0.0018;
      wowOsc.connect(wowDepth);
      wowDepth.connect(tapeDelayL.delayTime);
      wowOsc.start();

      polivoksShaper.connect(tapeDelayL);
      tapeDelayL.connect(tapeFilter);
      tapeFilter.connect(tapeDelayR);
      tapeDelayR.connect(tapeFeedback);
      tapeFeedback.connect(tapeDelayL);

      const delayMerger = ctx.createChannelMerger(2);
      tapeDelayL.connect(delayMerger, 0, 0);
      tapeDelayR.connect(delayMerger, 0, 1);
      delayMerger.connect(tapeMixGain);

      // Tanque Catedral Shimmer Reverb (+1 Octava y Quinta justa filtradas con terciopelo)
      reverbConvolver = ctx.createConvolver();
      reverbConvolver.buffer = buildVelvetCathedralIR(ctx, 5.4, 3.0);
      reverbMixGain = ctx.createGain();

      shimmerHarmOsc1 = ctx.createOscillator();
      shimmerHarmOsc2 = ctx.createOscillator();
      applyWaveformToOsc(shimmerHarmOsc1, 'choir');
      applyWaveformToOsc(shimmerHarmOsc2, 'astral');

      shimmerFilter = ctx.createBiquadFilter();
      shimmerFilter.type = 'lowpass';
      shimmerFilter.frequency.value = 2800;

      shimmerSendGain = ctx.createGain();
      shimmerSendGain.gain.value = 0.12;

      shimmerHarmOsc1.connect(shimmerFilter);
      shimmerHarmOsc2.connect(shimmerFilter);
      shimmerFilter.connect(shimmerSendGain);
      shimmerSendGain.connect(reverbConvolver);
      shimmerHarmOsc1.start();
      shimmerHarmOsc2.start();

      polivoksShaper.connect(reverbConvolver);
      tapeMixGain.connect(reverbConvolver);
      reverbConvolver.connect(reverbMixGain);

      // Salida Final con Realce Sub-Grave y Compresor Analógico
      polivoksShaper.connect(subBassBoost);
      tapeMixGain.connect(subBassBoost);
      reverbMixGain.connect(subBassBoost);

      subBassBoost.connect(compressor);
      compressor.connect(masterGain);
      masterGain.connect(analyser);
      masterGain.connect(ctx.destination);

      mediaDest = ctx.createMediaStreamDestination();
      masterGain.connect(mediaDest);

      updateDSP();
    }

    // 3. Actualizar todos los parámetros del motor de audio sin clics
    function updateDSP() {
      if (!ctx) return;
      const now = ctx.currentTime;

      const root = params.droneRoot * (1 + (state.pitchStripNorm - 0.5) * 0.08);
      const spread = params.droneSpread;
      const modStrip = state.modStripNorm;

      // Pesos del Joystick Vectorial 2D
      const wDrone = (1 - state.vecX * 0.5) * (1 - state.vecY * 0.5);
      const wPad   = (0.5 + state.vecX * 0.5) * (1 - state.vecY * 0.5);
      const wAtmos = (1 - state.vecX * 0.5) * (0.5 + state.vecY * 0.5);
      const wNoise = (0.5 + state.vecX * 0.5) * (0.5 + state.vecY * 0.5);

      // Capa 1: 6 Voces Drone Solar 42N
      const droneActive = state.droneMasterHold ? 1 : 0;
      droneLayerGain.gain.setTargetAtTime(params.droneLvl * wDrone * droneActive * 0.65, now, 0.06);

      droneVoiceNodes.forEach((node, i) => {
        const v = state.droneVoices[i];
        const baseFreq = root * v.ratio;
        const detuneHz = (i - 2.5) * spread * 1.4;
        node.oscA.frequency.setTargetAtTime(Math.max(20, baseFreq - detuneHz * 0.5), now, 0.08);
        node.oscB.frequency.setTargetAtTime(Math.max(20, baseFreq + detuneHz * 0.5 + 0.18), now, 0.08);
        node.voiceGain.gain.setTargetAtTime(v.muted ? 0 : 0.14, now, 0.05);
      });

      droneSubOsc.frequency.setTargetAtTime(Math.max(18, root * 0.5), now, 0.08);

      // Capa 2: Ambient Ø Blendwave Yin-Yang Pad
      const morph = params.padMorph;
      padLayerGain.gain.setTargetAtTime(params.padLvl * wPad * 0.55, now, 0.06);
      yinGain.gain.setTargetAtTime((1 - morph) * 0.48, now, 0.06);
      yangGain.gain.setTargetAtTime(morph * 0.48, now, 0.06);

      yinOscs.forEach(o => {
        o.osc.frequency.setTargetAtTime(root * 2 * o.intv * (1 - spread * 0.004), now, 0.1);
      });
      yangOscs.forEach(o => {
        o.osc.frequency.setTargetAtTime(root * 2 * o.intv * (1 + spread * 0.0045), now, 0.1);
      });

      // Capa 3: Atmos Melódico V/Oct + FM
      atmosLayerGain.gain.setTargetAtTime(params.atmosLvl * wAtmos * 0.58, now, 0.06);
      vcoFmGain.gain.setTargetAtTime(params.atmosFm * 280 * (0.35 + state.platePressureY), now, 0.05);

      // Capa 4: Schmitt Chaos & Formant Noise
      noiseLayerGain.gain.setTargetAtTime((params.atmosFm * 0.4 + 0.15) * wNoise * 0.65, now, 0.06);
      noiseBandFilter.frequency.setTargetAtTime(180 + modStrip * 2200 + state.shValue * 300, now, 0.08);
      schmittOscA.frequency.setTargetAtTime(65 + modStrip * 380 + state.shValue * 110, now, 0.08);
      schmittOscB.frequency.setTargetAtTime(8 + params.lfoRate * 45, now, 0.08);

      // Etapa de Filtros: Pasa-Bajos (LPF) + Pasa-Altos (HPF) Polivoks
      const effectiveLPF = Math.min(9500, Math.max(70, params.cutoff * (0.55 + modStrip * 1.15)));
      const effectiveHPF = Math.min(3200, Math.max(20, params.hpfCutoff));

      if (state.filterMode === 'lphp') {
        hpfL.type = 'highpass';
        hpfR.type = 'highpass';
        filterL.type = 'lowpass';
        filterR.type = 'lowpass';
        hpfL.frequency.setTargetAtTime(effectiveHPF, now, 0.06);
        hpfR.frequency.setTargetAtTime(effectiveHPF, now, 0.06);
        filterL.frequency.setTargetAtTime(effectiveLPF * 0.94, now, 0.06);
        filterR.frequency.setTargetAtTime(effectiveLPF * 1.06, now, 0.06);
      } else if (state.filterMode === 'lowpass') {
        hpfL.type = 'highpass';
        hpfR.type = 'highpass';
        hpfL.frequency.setTargetAtTime(20, now, 0.06);
        hpfR.frequency.setTargetAtTime(20, now, 0.06);
        filterL.type = 'lowpass';
        filterR.type = 'lowpass';
        filterL.frequency.setTargetAtTime(effectiveLPF * 0.94, now, 0.06);
        filterR.frequency.setTargetAtTime(effectiveLPF * 1.06, now, 0.06);
      } else if (state.filterMode === 'highpass') {
        hpfL.type = 'highpass';
        hpfR.type = 'highpass';
        hpfL.frequency.setTargetAtTime(effectiveHPF, now, 0.06);
        hpfR.frequency.setTargetAtTime(effectiveHPF, now, 0.06);
        filterL.type = 'lowpass';
        filterR.type = 'lowpass';
        filterL.frequency.setTargetAtTime(9500, now, 0.06);
        filterR.frequency.setTargetAtTime(9500, now, 0.06);
      } else {
        // Bandpass quirúrgico Polivoks
        hpfL.type = 'highpass';
        hpfR.type = 'highpass';
        hpfL.frequency.setTargetAtTime(effectiveHPF, now, 0.06);
        hpfR.frequency.setTargetAtTime(effectiveHPF, now, 0.06);
        filterL.type = 'bandpass';
        filterR.type = 'bandpass';
        filterL.frequency.setTargetAtTime(effectiveLPF * 0.92, now, 0.06);
        filterR.frequency.setTargetAtTime(effectiveLPF * 1.08, now, 0.06);
      }

      filterL.Q.setTargetAtTime(params.reso, now, 0.05);
      filterR.Q.setTargetAtTime(params.reso * 0.92, now, 0.05);
      hpfL.Q.setTargetAtTime(Math.min(8, params.reso * 0.55), now, 0.05);
      hpfR.Q.setTargetAtTime(Math.min(8, params.reso * 0.55), now, 0.05);

      lfoOsc.frequency.setTargetAtTime(params.lfoRate, now, 0.08);
      lfoGainL.gain.setTargetAtTime(params.lfoDepth * effectiveLPF * 0.55, now, 0.06);
      lfoGainR.gain.setTargetAtTime(params.lfoDepth * effectiveLPF * 0.48, now, 0.06);

      // Etapa de Trémolo / Pulser Estéreo
      if (tremOsc && tremDepthL && tremDepthR) {
        tremOsc.frequency.setTargetAtTime(params.tremRate, now, 0.05);
        const depthAmp = params.tremDepth * 0.48;
        const baseGain = 1.0 - depthAmp * 0.5;
        tremGainL.gain.setTargetAtTime(baseGain, now, 0.05);
        tremGainR.gain.setTargetAtTime(baseGain, now, 0.05);
        tremDepthL.gain.setTargetAtTime(depthAmp, now, 0.05);
        // Si está en modo STEREO PAN, invierte la fase del canal derecho (-depthAmp)
        tremDepthR.gain.setTargetAtTime(state.tremMode === 'stereo' ? -depthAmp : depthAmp, now, 0.05);
      }

      // Efectos: Tape Delay + Cathedral Shimmer
      tapeMixGain.gain.setTargetAtTime(params.delayMix * 0.65, now, 0.06);
      tapeFeedback.gain.setTargetAtTime(0.32 + params.delayMix * 0.42, now, 0.06);

      reverbMixGain.gain.setTargetAtTime((0.45 + params.shimmer * 0.5) * 0.95, now, 0.06);
      shimmerSendGain.gain.setTargetAtTime(params.shimmer * 0.24, now, 0.08);
      shimmerHarmOsc1.frequency.setTargetAtTime(root * 4.0, now, 0.15);
      shimmerHarmOsc2.frequency.setTargetAtTime(root * 6.0, now, 0.15);
    }

    // 4. Disparar Placa Táctil Capacitiva Solar 42N o Nota MIDI del Arturia MiniLab MkII
    function triggerSolarPlate(plateIdx, pressureY = 0.72) {
      if (!ctx) {
        initAudioEngine();
        state.running = true;
        document.getElementById('powerBtn').classList.add('active');
        document.getElementById('powerLed').classList.add('on');
      }
      if (ctx.state === 'suspended') ctx.resume();

      state.activePlateIdx = plateIdx;
      state.platePressureY = pressureY;

      document.querySelectorAll('.pcb-touch-pad').forEach((el, i) => {
        el.classList.toggle('touched', i === plateIdx || state.platesHeld[i]);
      });

      const bar = document.getElementById(`plateBar_${plateIdx}`);
      if (bar) bar.style.height = `${Math.round(pressureY * 100)}%`;

      const ratios = SCALES[state.scale] || SCALES.just;
      const root = params.droneRoot * 2;
      const targetFreq = root * ratios[plateIdx % 12];
      const now = ctx.currentTime;

      vcoMainOsc.frequency.setTargetAtTime(targetFreq, now, 0.06);
      vcoSubOsc.frequency.setTargetAtTime(targetFreq * 0.5, now, 0.06);
      vcoModOsc.frequency.setTargetAtTime(targetFreq * 1.5, now, 0.06);
      shimmerHarmOsc1.frequency.setTargetAtTime(targetFreq * 2.0, now, 0.18);

      vcoEnvGain.gain.cancelScheduledValues(now);
      vcoEnvGain.gain.setTargetAtTime(0.45 + pressureY * 0.4, now, 0.12);

      document.getElementById('chordReadoutBadge').textContent =
        `${ROMAN_NOTES[plateIdx]} · ${Math.round(targetFreq)}Hz`;

      updateDSP();
    }

    function releaseSolarPlate(plateIdx) {
      if (state.platesHeld[plateIdx]) return; // Si tiene HOLD activo no se apaga
      const padEl = document.getElementById(`pcbPlate_${plateIdx}`);
      if (padEl) padEl.classList.remove('touched');
      const bar = document.getElementById(`plateBar_${plateIdx}`);
      if (bar) bar.style.height = '0%';

      if (state.activePlateIdx === plateIdx) {
        state.activePlateIdx = -1;
        if (ctx) {
          const now = ctx.currentTime;
          vcoEnvGain.gain.cancelScheduledValues(now);
          vcoEnvGain.gain.setTargetAtTime(0.08, now, 0.95);
        }
      }
    }

    // Actualizar valor de un Knob (desde Mouse o desde Arturia MiniLab MkII CC)
    function setKnobValue(knobId, rawVal, fromMidi = false) {
      const def = KNOB_DEFS.find(k => k.id === knobId);
      if (!def) return;

      const clamped = Math.max(def.min, Math.min(def.max, rawVal));
      params[knobId] = clamped;

      const norm = (clamped - def.min) / (def.max - def.min);
      const deg = -135 + norm * 270;

      const ptr = document.getElementById(`knobPtr_${knobId}`);
      if (ptr) ptr.style.transform = `rotate(${deg}deg)`;

      const valEl = document.getElementById(`knobVal_${knobId}`);
      if (valEl) valEl.textContent = def.fmt(clamped);

      if (knobId === 'drive' && polivoksShaper) {
        polivoksShaper.curve = createWarmPolivoksCurve(clamped);
      }

      if (fromMidi) {
        const cell = document.getElementById(`knobCell_${knobId}`);
        if (cell) {
          cell.classList.add('midi-active');
          clearTimeout(cell._midiTimer);
          cell._midiTimer = setTimeout(() => cell.classList.remove('midi-active'), 220);
        }
      }

      updateDSP();
    }

    // 5. Construir toda la Interfaz Hardware Solar 42N + MiniLab MkII
    function buildHardwareUI() {
      // A. 6 Voces Drone Solar 42N
      const droneGrid = document.getElementById('droneBanksGrid');
      droneGrid.innerHTML = '';
      state.droneVoices.forEach((v, idx) => {
        const ch = document.createElement('div');
        ch.className = `drone-channel ${v.muted ? 'muted' : ''}`;
        ch.id = `droneCh_${idx}`;
        ch.innerHTML = `
          <div class="drone-ch-header">
            <span class="hw-led ${v.muted ? '' : 'amber on'}" id="droneLed_${idx}"></span>
            <span>${v.label}</span>
          </div>
          <input type="range" class="solar-slider" min="0.5" max="4.0" step="0.01" value="${v.ratio}" id="droneRatio_${idx}" />
          <span style="font-size:0.6rem; color:var(--silk-cream);" id="droneRatioVal_${idx}">×${v.ratio.toFixed(2)}</span>
          <button class="drone-toggle-btn" id="droneMuteBtn_${idx}">${v.muted ? '○' : '●'}</button>
        `;
        droneGrid.appendChild(ch);

        document.getElementById(`droneRatio_${idx}`).addEventListener('input', (e) => {
          v.ratio = parseFloat(e.target.value);
          document.getElementById(`droneRatioVal_${idx}`).textContent = `×${v.ratio.toFixed(2)}`;
          updateDSP();
        });

        document.getElementById(`droneMuteBtn_${idx}`).addEventListener('click', () => {
          toggleDroneVoice(idx);
        });
      });

      // B. 8 Pads RGB del Arturia MiniLab MkII
      renderMiniLabPads();

      // C. 16 Perillas Rotatorias Arturia MiniLab MkII (Knobs 1-8 y Knobs 9-16)
      const rowTop = document.getElementById('knobsRowTop');
      const rowBottom = document.getElementById('knobsRowBottom');
      rowTop.innerHTML = '';
      rowBottom.innerHTML = '';

      KNOB_DEFS.forEach((def, idx) => {
        const norm = (def.val - def.min) / (def.max - def.min);
        const deg = -135 + norm * 270;

        const cell = document.createElement('div');
        cell.className = `rotary-cell ${def.polivoks ? 'polivoks-knob' : ''}`;
        cell.id = `knobCell_${def.id}`;
        cell.innerHTML = `
          <div class="knob-top-badges">
            <span class="knob-k-num">${def.kNum}</span>
            <span class="knob-cc-tag" id="knobCcBadge_${def.id}">CC${def.cc}</span>
          </div>
          <div class="solar-knob-dial">
            <div class="knob-pointer" id="knobPtr_${def.id}" style="transform: rotate(${deg}deg);"></div>
          </div>
          <div class="knob-title">${def.name}</div>
          <div class="knob-readout" id="knobVal_${def.id}">${def.fmt(def.val)}</div>
        `;

        // Arrastrar verticalmente con el mouse o seleccionar para MIDI Learn
        let startY = 0;
        let startVal = def.val;

        cell.addEventListener('pointerdown', (e) => {
          if (state.midiLearnActive) {
            state.learningKnobId = def.id;
            document.querySelectorAll('.rotary-cell').forEach(c => c.classList.remove('learning-target'));
            cell.classList.add('learning-target');
            document.getElementById('midiMonitorBadge').textContent = `${def.kNum} ?`;
            return;
          }

          cell.setPointerCapture(e.pointerId);
          startY = e.clientY;
          startVal = params[def.id];

          const onMove = (ev) => {
            const dy = startY - ev.clientY;
            const span = def.max - def.min;
            const newVal = startVal + (dy / 130) * span;
            setKnobValue(def.id, newVal, false);
          };

          const onUp = () => {
            cell.removeEventListener('pointermove', onMove);
            cell.removeEventListener('pointerup', onUp);
          };

          cell.addEventListener('pointermove', onMove);
          cell.addEventListener('pointerup', onUp);
        });

        // Doble clic reinicia la perilla a su valor original
        cell.addEventListener('dblclick', () => setKnobValue(def.id, def.val, false));

        if (idx < 8) rowTop.appendChild(cell);
        else rowBottom.appendChild(cell);
      });

      // D. 12 Placas Táctiles de Cobre Dorado
      const platesContainer = document.getElementById('copperPlatesContainer');
      platesContainer.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const unit = document.createElement('div');
        unit.className = 'copper-plate-unit';
        unit.innerHTML = `
          <button class="plate-hold-toggle" id="plateHold_${i}" title="Hold">∞</button>
          <div class="pcb-touch-pad" id="pcbPlate_${i}">
            <span class="plate-label-badge">${ROMAN_NOTES[i]}</span>
            <div class="plate-pressure-bar" id="plateBar_${i}"></div>
            <span class="plate-label-badge" style="font-size:0.52rem; color:var(--silk-muted);">${PC_KEYS[i].toUpperCase()}</span>
          </div>
        `;
        platesContainer.appendChild(unit);

        const holdBtn = document.getElementById(`plateHold_${i}`);
        holdBtn.addEventListener('click', () => {
          state.platesHeld[i] = !state.platesHeld[i];
          holdBtn.classList.toggle('held', state.platesHeld[i]);
          if (state.platesHeld[i]) {
            triggerSolarPlate(i, 0.78);
          } else {
            releaseSolarPlate(i);
          }
        });

        const padEl = document.getElementById(`pcbPlate_${i}`);
        const handlePadPointer = (e) => {
          const rect = padEl.getBoundingClientRect();
          const normY = Math.max(0.05, Math.min(1, 1 - (e.clientY - rect.top) / rect.height));
          triggerSolarPlate(i, normY);
        };

        padEl.addEventListener('pointerdown', (e) => {
          padEl.setPointerCapture(e.pointerId);
          handlePadPointer(e);
        });
        padEl.addEventListener('pointermove', (e) => {
          if (e.buttons > 0) handlePadPointer(e);
        });
        padEl.addEventListener('pointerup', () => releaseSolarPlate(i));
      }

      // E. Secuenciador Analógico de 8 Fases Lunares
      const seqContainer = document.getElementById('seqColumnsContainer');
      seqContainer.innerHTML = '';
      state.seqSteps.forEach((st, idx) => {
        const col = document.createElement('div');
        col.className = 'seq-col';
        col.id = `seqCol_${idx}`;
        col.innerHTML = `
          <span style="font-size:0.65rem; color:var(--silk-gold);">${LUNAR_PHASES[idx]}</span>
          <input type="range" class="solar-slider" min="0" max="11" step="1" value="${st.noteIdx}" id="seqCv_${idx}" />
          <span style="font-size:0.62rem; font-weight:700; color:var(--silk-gold-bright);" id="seqNoteTxt_${idx}">${ROMAN_NOTES[st.noteIdx]}</span>
          <button class="drone-toggle-btn" id="seqGateBtn_${idx}" style="opacity:${st.gate ? 1 : 0.35}">${st.gate ? '●' : '○'}</button>
        `;
        seqContainer.appendChild(col);

        document.getElementById(`seqCv_${idx}`).addEventListener('input', (e) => {
          st.noteIdx = parseInt(e.target.value, 10);
          document.getElementById(`seqNoteTxt_${idx}`).textContent = ROMAN_NOTES[st.noteIdx];
        });

        document.getElementById(`seqGateBtn_${idx}`).addEventListener('click', (e) => {
          st.gate = !st.gate;
          e.target.textContent = st.gate ? '●' : '○';
          e.target.style.opacity = st.gate ? '1' : '0.35';
        });
      });

      bindWaveAndHeaderControls();
    }

    function toggleDroneVoice(idx) {
      const v = state.droneVoices[idx];
      if (!v) return;
      v.muted = !v.muted;
      const ch = document.getElementById(`droneCh_${idx}`);
      const led = document.getElementById(`droneLed_${idx}`);
      const btn = document.getElementById(`droneMuteBtn_${idx}`);
      if (ch) ch.classList.toggle('muted', v.muted);
      if (led) led.className = `hw-led ${v.muted ? '' : 'amber on'}`;
      if (btn) btn.textContent = v.muted ? '○' : '●';
      renderMiniLabPads();
      updateDSP();
    }

    function renderMiniLabPads() {
      const container = document.getElementById('minilabPadsRow');
      if (!container) return;
      container.innerHTML = '';

      const padLabelsDrones = [
        '☉ I', '☽ II', '☿ III', '♀ IV',
        '♂ V', '♃ VI', '🎲', '✦ ∞'
      ];
      const padLabelsScenes = [
        'I', 'II', 'III', 'IV',
        'V', 'VI', 'VII', 'VIII'
      ];

      for (let i = 0; i < 8; i++) {
        const isDroneMode = state.padMode === 'drones';
        const isActive = isDroneMode && i < 6 ? !state.droneVoices[i].muted : false;
        const pad = document.createElement('div');
        pad.className = `minilab-pad ${isActive ? 'pad-active' : ''}`;
        pad.innerHTML = `
          <span class="pad-num">P${i + 1}</span>
          <span class="pad-action">${isDroneMode ? padLabelsDrones[i] : padLabelsScenes[i]}</span>
        `;
        pad.addEventListener('click', () => handleMiniLabPadTrigger(i));
        container.appendChild(pad);
      }
    }

    function handleMiniLabPadTrigger(padIdx) {
      if (state.padMode === 'scenes') {
        document.getElementById('presetSelect').value = String(padIdx);
        loadScenePreset(padIdx);
        return;
      }

      if (padIdx < 6) {
        toggleDroneVoice(padIdx);
      } else if (padIdx === 6) {
        mutateAmbientTexture();
      } else if (padIdx === 7) {
        // Maximizar Shimmer y Reverb instantáneamente (Freeze angelical)
        const nextShim = params.shimmer > 0.85 ? 0.45 : 0.95;
        setKnobValue('shimmer', nextShim, true);
        setKnobValue('revMix', 0.92, true);
      }
    }

    // 6. Vincular Botones de Formas de Onda, Escenas y Web MIDI API para Arturia MiniLab MkII
    function bindWaveAndHeaderControls() {
      const bindPillGroup = (containerId, labelId, callback) => {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.querySelectorAll('.wave-pill').forEach(btn => {
          btn.addEventListener('click', () => {
            container.querySelectorAll('.wave-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const wave = btn.dataset.wave || btn.dataset.mode;
            if (labelId) document.getElementById(labelId).textContent = btn.textContent;
            callback(wave);
          });
        });
      };

      bindPillGroup('vcoWavePills', 'lblVcoWave', (w) => {
        state.vcoWave = w;
        applyWaveformToOsc(vcoMainOsc, w);
      });

      bindPillGroup('droneWavePills', 'lblDroneWave', (w) => {
        state.droneWave = w;
        droneVoiceNodes.forEach(n => {
          applyWaveformToOsc(n.oscA, w);
          applyWaveformToOsc(n.oscB, w);
        });
      });

      bindPillGroup('yinWavePills', 'lblYinWave', (w) => {
        state.yinWave = w;
        yinOscs.forEach(o => applyWaveformToOsc(o.osc, w));
      });

      bindPillGroup('yangWavePills', 'lblYangWave', (w) => {
        state.yangWave = w;
        yangOscs.forEach(o => applyWaveformToOsc(o.osc, w));
      });

      bindPillGroup('subWavePills', 'lblSubWave', (w) => {
        state.subWave = w;
        applyWaveformToOsc(droneSubOsc, w);
        applyWaveformToOsc(vcoSubOsc, w);
      });

      bindPillGroup('lfoWavePills', 'lblLfoWave', (w) => {
        state.lfoWave = w;
        applyWaveformToOsc(lfoOsc, w);
      });

      bindPillGroup('tremWavePills', 'lblTremWave', (w) => {
        state.tremWave = w;
        applyWaveformToOsc(tremOsc, w);
      });

      bindPillGroup('tremModePills', 'lblTremMode', (m) => {
        state.tremMode = m;
        updateDSP();
      });

      bindPillGroup('filterModePills', 'filterModeLbl', (m) => {
        state.filterMode = m;
        updateDSP();
      });

      // Power Button
      document.getElementById('powerBtn').addEventListener('click', () => {
        if (!ctx) {
          initAudioEngine();
          state.running = true;
          document.getElementById('powerBtn').classList.add('active');
          document.getElementById('powerLed').classList.add('on');
        } else if (ctx.state === 'running') {
          ctx.suspend();
          state.running = false;
          document.getElementById('powerBtn').classList.remove('active');
          document.getElementById('powerLed').classList.remove('on');
        } else {
          ctx.resume();
          state.running = true;
          document.getElementById('powerBtn').classList.add('active');
          document.getElementById('powerLed').classList.add('on');
        }
      });

      // Tiras Táctiles Interactivas con el Mouse también
      const bindStripDrag = (trackId, fillId, valId, onVal) => {
        const track = document.getElementById(trackId);
        const updateFromEvent = (e) => {
          const rect = track.getBoundingClientRect();
          const norm = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          document.getElementById(fillId).style.width = `${Math.round(norm * 100)}%`;
          document.getElementById(valId).textContent = `${Math.round(norm * 100)}%`;
          onVal(norm);
          updateDSP();
        };
        track.addEventListener('pointerdown', (e) => {
          track.setPointerCapture(e.pointerId);
          updateFromEvent(e);
        });
        track.addEventListener('pointermove', (e) => {
          if (e.buttons > 0) updateFromEvent(e);
        });
      };

      bindStripDrag('pitchStripTrack', 'pitchStripFill', 'pitchStripVal', (n) => {
        state.pitchStripNorm = n;
        setKnobValue('padMorph', n, false);
      });

      bindStripDrag('modStripTrack', 'modStripFill', 'modStripVal', (n) => {
        state.modStripNorm = n;
      });

      // Joystick Vectorial 2D
      const vCanvas = document.getElementById('vectorCanvas');
      const moveVec = (e) => {
        const rect = vCanvas.getBoundingClientRect();
        state.vecX = Math.max(0.05, Math.min(0.95, (e.clientX - rect.left) / rect.width));
        state.vecY = Math.max(0.05, Math.min(0.95, (e.clientY - rect.top) / rect.height));
        updateDSP();
      };
      vCanvas.addEventListener('pointerdown', (e) => {
        vCanvas.setPointerCapture(e.pointerId);
        state.draggingVec = true;
        state.autoOrbit = false;
        document.getElementById('autoOrbitBtn').classList.remove('active');
        moveVec(e);
      });
      vCanvas.addEventListener('pointermove', (e) => {
        if (state.draggingVec) moveVec(e);
      });
      vCanvas.addEventListener('pointerup', () => { state.draggingVec = false; });

      // Botones Superiores
      document.getElementById('droneMasterHoldBtn').addEventListener('click', (e) => {
        state.droneMasterHold = !state.droneMasterHold;
        e.target.classList.toggle('active', state.droneMasterHold);
        updateDSP();
      });

      document.getElementById('chordLockBtn').addEventListener('click', () => {
        // Afinar las 6 voces de Drone en una quinta y octava armónica justa perfecta
        const harmonicSet = [1.0, 1.5, 2.0, 2.5, 3.0, 0.5];
        state.droneVoices.forEach((v, idx) => {
          v.ratio = harmonicSet[idx];
          document.getElementById(`droneRatio_${idx}`).value = v.ratio;
          document.getElementById(`droneRatioVal_${idx}`).textContent = `×${v.ratio.toFixed(2)}`;
        });
        updateDSP();
      });

      document.getElementById('padModeDronesBtn').addEventListener('click', () => {
        state.padMode = 'drones';
        document.getElementById('padModeDronesBtn').classList.add('active');
        document.getElementById('padModeScenesBtn').classList.remove('active');
        renderMiniLabPads();
      });

      document.getElementById('padModeScenesBtn').addEventListener('click', () => {
        state.padMode = 'scenes';
        document.getElementById('padModeScenesBtn').classList.add('active');
        document.getElementById('padModeDronesBtn').classList.remove('active');
        renderMiniLabPads();
      });

      document.getElementById('autoOrbitBtn').addEventListener('click', (e) => {
        state.autoOrbit = !state.autoOrbit;
        e.target.classList.toggle('active', state.autoOrbit);
      });

      document.getElementById('releaseAllPlatesBtn').addEventListener('click', () => {
        state.platesHeld.fill(false);
        document.querySelectorAll('.plate-hold-toggle').forEach(b => b.classList.remove('held'));
        for (let i = 0; i < 12; i++) releaseSolarPlate(i);
      });

      document.getElementById('seqToggleBtn').addEventListener('click', (e) => {
        state.seqRunning = !state.seqRunning;
        e.target.classList.toggle('active', state.seqRunning);
        e.target.textContent = state.seqRunning ? '▶' : '⏸';
      });

      document.getElementById('seqRandomizeBtn').addEventListener('click', () => {
        state.seqSteps.forEach((st, idx) => {
          st.noteIdx = Math.floor(Math.random() * 12);
          st.gate = Math.random() > 0.2;
          document.getElementById(`seqCv_${idx}`).value = st.noteIdx;
          document.getElementById(`seqNoteTxt_${idx}`).textContent = ROMAN_NOTES[st.noteIdx];
          const gBtn = document.getElementById(`seqGateBtn_${idx}`);
          gBtn.textContent = st.gate ? '●' : '○';
          gBtn.style.opacity = st.gate ? '1' : '0.35';
        });
      });

      document.getElementById('presetSelect').addEventListener('change', (e) => {
        loadScenePreset(parseInt(e.target.value, 10));
      });

      document.getElementById('scaleSelect').addEventListener('change', (e) => {
        state.scale = e.target.value;
        updateDSP();
      });

      // MIDI Learn Button
      const learnBtn = document.getElementById('midiLearnBtn');
      learnBtn.addEventListener('click', () => {
        state.midiLearnActive = !state.midiLearnActive;
        learnBtn.classList.toggle('learn-active', state.midiLearnActive);
        if (!state.midiLearnActive) {
          state.learningKnobId = null;
          document.querySelectorAll('.rotary-cell').forEach(c => c.classList.remove('learning-target'));
          document.getElementById('midiMonitorBadge').textContent = 'MIDI';
        } else {
          document.getElementById('midiMonitorBadge').textContent = '🎛️ ?';
        }
      });

      // Teclado PC
      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        const idx = PC_KEYS.indexOf(e.key.toLowerCase());
        if (idx !== -1) triggerSolarPlate(idx, 0.78);
      });
      window.addEventListener('keyup', (e) => {
        const idx = PC_KEYS.indexOf(e.key.toLowerCase());
        if (idx !== -1) releaseSolarPlate(idx);
      });

      // Grabadora de audio
      const recBtn = document.getElementById('recBtn');
      recBtn.addEventListener('click', () => {
        if (!ctx) initAudioEngine();
        if (!mediaRecorder || mediaRecorder.state === 'inactive') {
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(mediaDest.stream);
          mediaRecorder.ondataavailable = (ev) => {
            if (ev.data.size > 0) recordedChunks.push(ev.data);
          };
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `420_${Date.now()}.webm`;
            a.click();
          };
          mediaRecorder.start();
          recBtn.classList.add('active');
          recBtn.textContent = '■';
        } else {
          mediaRecorder.stop();
          recBtn.classList.remove('active');
          recBtn.textContent = '●';
        }
      });

      initArturiaMiniLabMidi();
    }

    function mutateAmbientTexture() {
      const rnd = (min, max) => min + Math.random() * (max - min);
      setKnobValue('droneRoot', rnd(38, 92), true);
      setKnobValue('droneSpread', rnd(0.15, 0.65), true);
      setKnobValue('cutoff', rnd(520, 3800), true);
      setKnobValue('hpfCutoff', rnd(25, 420), true);
      setKnobValue('reso', rnd(1.5, 9.5), true);
      setKnobValue('tremDepth', rnd(0.15, 0.72), true);
      setKnobValue('tremRate', rnd(0.35, 6.5), true);
      setKnobValue('shimmer', rnd(0.35, 0.90), true);
      setKnobValue('atmosFm', rnd(0.1, 0.65), true);
    }

    // 7. Escenas Preconfiguradas (con LPF, HPF y Trémolo)
    const SCENE_PRESETS = [
      { droneRoot: 55.0, droneSpread: 0.32, padLvl: 0.76, atmosFm: 0.30, cutoff: 1650, hpfCutoff: 45,  reso: 3.6, drive: 0.28, tremDepth: 0.35, tremRate: 1.85, shimmer: 0.68, scale: 'just', vco: 'sawtooth', drone: 'supersaw' },
      { droneRoot: 41.2, droneSpread: 0.65, padLvl: 0.45, atmosFm: 0.68, cutoff: 780,  hpfCutoff: 110, reso: 10.5,drive: 0.75, tremDepth: 0.62, tremRate: 4.80, shimmer: 0.28, scale: 'phrygian', vco: 'square', drone: 'sawtooth' },
      { droneRoot: 65.4, droneSpread: 0.18, padLvl: 0.92, atmosFm: 0.18, cutoff: 3400, hpfCutoff: 140, reso: 2.2, drive: 0.14, tremDepth: 0.28, tremRate: 0.85, shimmer: 0.88, scale: 'lydian', vco: 'glass', drone: 'choir' },
      { droneRoot: 49.0, droneSpread: 0.48, padLvl: 0.62, atmosFm: 0.74, cutoff: 2250, hpfCutoff: 320, reso: 6.4, drive: 0.35, tremDepth: 0.55, tremRate: 6.20, shimmer: 0.62, scale: 'minor', vco: 'triangle', drone: 'glass' },
      { droneRoot: 58.3, droneSpread: 0.25, padLvl: 0.80, atmosFm: 0.24, cutoff: 1320, hpfCutoff: 55,  reso: 4.5, drive: 0.42, tremDepth: 0.40, tremRate: 1.40, shimmer: 0.65, scale: 'just', vco: 'organ', drone: 'organ' },
      { droneRoot: 73.4, droneSpread: 0.14, padLvl: 0.78, atmosFm: 0.25, cutoff: 2800, hpfCutoff: 180, reso: 2.8, drive: 0.12, tremDepth: 0.30, tremRate: 2.40, shimmer: 0.54, scale: 'pentatonic', vco: 'glass', drone: 'triangle' },
      { droneRoot: 43.6, droneSpread: 0.55, padLvl: 0.88, atmosFm: 0.35, cutoff: 1850, hpfCutoff: 35,  reso: 4.8, drive: 0.48, tremDepth: 0.22, tremRate: 0.65, shimmer: 0.72, scale: 'minor', vco: 'sawtooth', drone: 'supersaw' },
      { droneRoot: 34.0, droneSpread: 0.52, padLvl: 0.82, atmosFm: 0.42, cutoff: 920,  hpfCutoff: 25,  reso: 7.2, drive: 0.44, tremDepth: 0.70, tremRate: 0.35, shimmer: 0.92, scale: 'microtonal', vco: 'organ', drone: 'choir' }
    ];

    function loadScenePreset(idx) {
      const p = SCENE_PRESETS[idx];
      if (!p) return;
      setKnobValue('droneRoot', p.droneRoot, false);
      setKnobValue('droneSpread', p.droneSpread, false);
      setKnobValue('padLvl', p.padLvl, false);
      setKnobValue('atmosFm', p.atmosFm, false);
      setKnobValue('cutoff', p.cutoff, false);
      setKnobValue('hpfCutoff', p.hpfCutoff, false);
      setKnobValue('reso', p.reso, false);
      setKnobValue('drive', p.drive, false);
      setKnobValue('tremDepth', p.tremDepth, false);
      setKnobValue('tremRate', p.tremRate, false);
      setKnobValue('shimmer', p.shimmer, false);

      state.scale = p.scale;
      document.getElementById('scaleSelect').value = p.scale;
      updateDSP();
    }

    // 8. Integración Completa con el Controlador MIDI Arturia MiniLab MkII
    function initArturiaMiniLabMidi() {
      if (!navigator.requestMIDIAccess) {
        document.getElementById('midiMonitorBadge').textContent = 'SIN WEB MIDI';
        return;
      }

      navigator.requestMIDIAccess({ sysex: false }).then((midiAccess) => {
        const selectEl = document.getElementById('midiDeviceSelect');

        const refreshInputs = () => {
          const inputs = Array.from(midiAccess.inputs.values());
          selectEl.innerHTML = '';

          if (inputs.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = 'MIDI USB';
            selectEl.appendChild(opt);
            return;
          }

          let preferred = inputs.find(i => /minilab|arturia/i.test(i.name || '')) || inputs[0];

          inputs.forEach(inp => {
            const opt = document.createElement('option');
            opt.value = inp.id;
            opt.textContent = inp.name;
            if (inp.id === preferred.id) opt.selected = true;
            selectEl.appendChild(opt);
            inp.onmidimessage = null;
          });

          preferred.onmidimessage = handleMidiPacket;
          document.getElementById('midiMonitorBadge').textContent = `✦ ${preferred.name.slice(0, 12)}`;
        };

        selectEl.addEventListener('change', (e) => {
          const inputs = Array.from(midiAccess.inputs.values());
          inputs.forEach(i => { i.onmidimessage = null; });
          const chosen = inputs.find(i => i.id === e.target.value);
          if (chosen) {
            chosen.onmidimessage = handleMidiPacket;
            document.getElementById('midiMonitorBadge').textContent = `✦ ${chosen.name.slice(0, 12)}`;
          }
        });

        midiAccess.onstatechange = refreshInputs;
        refreshInputs();
      }).catch(() => {});
    }

    function handleMidiPacket(event) {
      const [status, d1, d2] = event.data;
      const cmd = status & 0xf0;
      const ch = (status & 0x0f) + 1;

      const badge = document.getElementById('midiMonitorBadge');

      // 1. Control Change (CC): 16 Encoders del MiniLab MkII + Mod Strip (CC 1)
      if (cmd === 0xb0) {
        badge.textContent = `MIDI CC${d1}: ${d2}`;

        // Si MIDI Learn está esperando asignar un Knob
        if (state.midiLearnActive && state.learningKnobId && d1 !== 1) {
          const def = KNOB_DEFS.find(k => k.id === state.learningKnobId);
          if (def) {
            def.cc = d1;
            document.getElementById(`knobCcBadge_${def.id}`).textContent = `CC${d1}`;
            badge.textContent = `ASIGNADO ${def.kNum} → CC${d1}`;
          }
          state.midiLearnActive = false;
          state.learningKnobId = null;
          document.getElementById('midiLearnBtn').classList.remove('learn-active');
          document.querySelectorAll('.rotary-cell').forEach(c => c.classList.remove('learning-target'));
          return;
        }

        // Mod Strip (CC 1)
        if (d1 === 1) {
          const norm = d2 / 127;
          state.modStripNorm = norm;
          document.getElementById('modStripFill').style.width = `${Math.round(norm * 100)}%`;
          document.getElementById('modStripVal').textContent = `${Math.round(norm * 100)}%`;
          updateDSP();
          return;
        }

        // Buscar Knob mapeado a este CC
        const knobDef = KNOB_DEFS.find(k => k.cc === d1 || k.altCc === d1);
        if (knobDef) {
          const span = knobDef.max - knobDef.min;
          // Detectar si el encoder del Arturia MiniLab MkII está en modo Relativo (61..67) o Absoluto (0..127)
          let newVal;
          if (d2 >= 61 && d2 <= 67 && d2 !== 64 && knobDef._lastRaw === undefined) {
            const delta = (d2 - 64) * (span * 0.015);
            newVal = params[knobDef.id] + delta;
          } else {
            newVal = knobDef.min + (d2 / 127) * span;
            knobDef._lastRaw = d2;
          }
          setKnobValue(knobDef.id, newVal, true);
        }
        return;
      }

      // 2. Pitch Bend Strip (0xE0)
      if (cmd === 0xe0) {
        const pb14 = (d2 << 7) | d1;
        const norm = pb14 / 16383;
        state.pitchStripNorm = norm;
        document.getElementById('pitchStripFill').style.width = `${Math.round(norm * 100)}%`;
        document.getElementById('pitchStripVal').textContent = `${Math.round(norm * 100)}%`;
        setKnobValue('padMorph', norm, true);
        return;
      }

      // 3. Note On (Pads 1-8 en notas 36-43 o Teclado de 25 teclas)
      if (cmd === 0x90 && d2 > 0) {
        badge.textContent = `NOTE ${d1} VEL ${d2}`;
        if ((ch === 10 || (d1 >= 36 && d1 <= 43)) && d1 >= 36 && d1 <= 43) {
          handleMiniLabPadTrigger(d1 - 36);
          return;
        }
        // Teclado de 25 teclas: actualiza fundamental si es octava grave, o toca las 12 placas capacitivas
        if (d1 < 48) {
          const newRoot = 440 * Math.pow(2, (d1 - 69) / 12);
          setKnobValue('droneRoot', newRoot, true);
        }
        triggerSolarPlate(d1 % 12, d2 / 127);
        return;
      }

      // 4. Note Off
      if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) {
        if (d1 >= 36 && d1 <= 43 && ch === 10) return;
        releaseSolarPlate(d1 % 12);
      }
    }

    // 9. Animación Continua: Secuenciador Analógico + Órbita Lissajous + Pantallas CRT
    let phase = 0;
    let lastStepMs = 0;

    function mainLoop(timestamp) {
      requestAnimationFrame(mainLoop);

      phase += 0.016;

      // Avanzar Secuenciador de 8 pasos
      if (state.running && state.seqRunning && ctx) {
        const stepInterval = Math.max(180, 950 - params.lfoRate * 380);
        if (timestamp - lastStepMs >= stepInterval) {
          lastStepMs = timestamp;
          state.seqStepIdx = (state.seqStepIdx + 1) % 8;

          document.querySelectorAll('.seq-col').forEach((el, i) => {
            el.classList.toggle('active-step', i === state.seqStepIdx);
          });

          // Actualizar Sample & Hold
          state.shTarget = (Math.random() * 2 - 1);

          const st = state.seqSteps[state.seqStepIdx];
          if (st.gate && state.activePlateIdx === -1) {
            const ratios = SCALES[state.scale] || SCALES.just;
            const freq = params.droneRoot * 2 * ratios[st.noteIdx];
            const now = ctx.currentTime;
            vcoMainOsc.frequency.setTargetAtTime(freq, now, 0.12);
            vcoSubOsc.frequency.setTargetAtTime(freq * 0.5, now, 0.12);
            vcoModOsc.frequency.setTargetAtTime(freq * 2.0, now, 0.12);
            shimmerHarmOsc2.frequency.setTargetAtTime(freq * 2.0, now, 0.25);

            vcoEnvGain.gain.cancelScheduledValues(now);
            vcoEnvGain.gain.setTargetAtTime(0.38, now, 0.14);
            vcoEnvGain.gain.setTargetAtTime(0.10, now + 0.22, 0.65);
          }
        }
      }

      state.shValue += (state.shTarget - state.shValue) * 0.05;

      // Órbita Vectorial Automática
      if (state.autoOrbit && !state.draggingVec) {
        const t = phase * params.lfoRate * 2.2;
        state.vecX = 0.5 + 0.38 * Math.sin(t);
        state.vecY = 0.5 + 0.38 * Math.cos(t * 0.71 + 0.6);
        if (state.running) updateDSP();
      }

      drawVectorCRT();
      drawScopeCRT();
    }

    function drawVectorCRT() {
      const canvas = document.getElementById('vectorCanvas');
      const c = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const cx = w / 2, cy = h / 2;

      c.fillStyle = '#05040a';
      c.fillRect(0, 0, w, h);

      // Anillos de Astrolabio Cósmico y Geometría Sagrada
      c.strokeStyle = 'rgba(223, 186, 105, 0.22)';
      c.lineWidth = 1;
      [28, 52, 72].forEach(r => {
        c.beginPath();
        c.arc(cx, cy, r, 0, Math.PI * 2);
        c.stroke();
      });

      // Hexagrama Alquímico Giratorio Lento
      c.save();
      c.translate(cx, cy);
      c.rotate(phase * 0.18);
      c.strokeStyle = 'rgba(157, 78, 221, 0.28)';
      for (let t = 0; t < 2; t++) {
        c.beginPath();
        for (let i = 0; i < 3; i++) {
          const ang = (i * Math.PI * 2) / 3 + (t * Math.PI);
          const x = Math.cos(ang) * 52;
          const y = Math.sin(ang) * 52;
          if (i === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        c.closePath();
        c.stroke();
      }
      c.restore();

      const px = state.vecX * w;
      const py = state.vecY * h;

      // Líneas de constelación hacia los 4 Elementos
      c.strokeStyle = 'rgba(249, 220, 148, 0.38)';
      c.beginPath();
      c.moveTo(0, 0); c.lineTo(px, py);
      c.moveTo(w, 0); c.lineTo(px, py);
      c.moveTo(0, h); c.lineTo(px, py);
      c.moveTo(w, h); c.lineTo(px, py);
      c.stroke();

      // Orbe Solar-Lunar Eclipsado en el cursor
      c.fillStyle = '#f9dc94';
      c.shadowColor = '#f9dc94';
      c.shadowBlur = 14;
      c.beginPath();
      c.arc(px, py, 8, 0, Math.PI * 2);
      c.fill();
      c.shadowBlur = 0;

      c.fillStyle = '#05040a';
      c.beginPath();
      c.arc(px + 2.5, py - 1.5, 5.5, 0, Math.PI * 2);
      c.fill();
    }

    function drawScopeCRT() {
      const canvas = document.getElementById('scopeCanvas');
      const c = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;

      c.fillStyle = 'rgba(6, 8, 11, 0.35)';
      c.fillRect(0, 0, w, h);

      if (!analyser) return;

      const freq = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(freq);
      const bars = 40;
      const bw = w / bars;
      for (let i = 0; i < bars; i++) {
        const v = freq[i * 2] / 255;
        const bh = v * h * 0.75;
        c.fillStyle = `rgba(216, 177, 90, ${0.15 + v * 0.4})`;
        c.fillRect(i * bw, h - bh, bw - 1, bh);
      }

      const time = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(time);
      c.strokeStyle = '#00e5ff';
      c.lineWidth = 1.8;
      c.beginPath();
      const slice = w / time.length;
      for (let i = 0; i < time.length; i++) {
        const y = (time[i] / 128.0) * (h / 2);
        if (i === 0) c.moveTo(0, y);
        else c.lineTo(i * slice, y);
      }
      c.stroke();

      // Dibujar ventana de corte Pasa-Altos (HPF) y Pasa-Bajos (LPF) en el CRT
      const hpfX = Math.min(w * 0.48, (Math.log10(Math.max(20, params.hpfCutoff) / 20) / Math.log10(2400 / 20)) * (w * 0.48));
      const lpfX = Math.max(hpfX + 8, (Math.log10(Math.max(80, params.cutoff) / 80) / Math.log10(9500 / 80)) * w);

      c.fillStyle = 'rgba(217, 56, 41, 0.09)';
      c.fillRect(hpfX, 0, Math.max(4, lpfX - hpfX), h);

      c.strokeStyle = 'rgba(255, 107, 91, 0.75)';
      c.lineWidth = 1.2;
      c.beginPath();
      c.moveTo(hpfX, 0); c.lineTo(hpfX, h);
      c.moveTo(lpfX, 0); c.lineTo(lpfX, h);
      c.stroke();
    }

    buildHardwareUI();
    requestAnimationFrame(mainLoop);
  </script>
